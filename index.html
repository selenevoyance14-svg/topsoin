<style>

  *{box-sizing:border-box}

  #app{min-height:100vh}

  @media (max-width:900px){
    .site-header-inner{grid-template-columns:1fr auto!important;padding:15px 20px!important}
    .site-header-inner nav{display:none!important}
    .site-header-inner>div:last-child>a:not(:last-child){display:none!important}
    .hero-grid{grid-template-columns:1fr!important;padding:28px 20px 20px!important}
    .hero-grid>div:first-child{padding:24px 0 4px!important}
    .hero-grid>div:nth-child(2){min-height:500px!important}
    .promise-grid{grid-template-columns:repeat(2,1fr)!important;padding:30px 20px!important}
    .collections-grid{grid-template-columns:repeat(2,1fr)!important}

    .editorial-grid{grid-template-columns:1fr!important;gap:38px!important}
    .footer-grid{grid-template-columns:repeat(2,1fr)!important}
  }
  @media (max-width:560px){
    .site-header-inner{display:flex!important;justify-content:space-between!important}
    .hero-grid>div:nth-child(2){min-height:420px!important}
    .hero-grid h1{font-size:60px!important}
    .promise-grid,.stats-grid{grid-template-columns:1fr!important}
    .collections-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
    .product-grid,.gift-grid{grid-template-columns:1fr!important}
    .footer-grid{grid-template-columns:1fr!important}

  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.6)} }
